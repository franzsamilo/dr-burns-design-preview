const KIND_LABEL = {doc:'M',page:'H',data:'J',pdf:'P',img:'I',video:'V',archive:'Z',folder:'D',file:'F'};
let client = 'burns';
const $ = s => document.querySelector(s);
const board = $('#board');

function keyFor(c){ return 'kb-layout-'+c+'-v1'; }
function orderKey(c){ return 'kb-order-'+c+'-v1'; }

// Build initial model {cols:[{id,title}], place:{itemId:colId}, order:[itemId per col...]}
function defaultModel(c){
  const items = DATA[c].items;
  const cats = [];
  items.forEach(it=>{ if(!cats.includes(it.cat)) cats.push(it.cat); });
  const cols = cats.map((t,i)=>({id:'c'+i, title:t}));
  const place = {}; const order = {};
  cols.forEach(col=>order[col.id]=[]);
  items.forEach((it,idx)=>{ const col = cols.find(c2=>c2.title===it.cat); place[idx]=col.id; order[col.id].push(idx); });
  return {cols, place, order};
}
function loadModel(c){
  try{ const s = localStorage.getItem(keyFor(c)); if(s){ return JSON.parse(s); } }catch(e){}
  return defaultModel(c);
}
function saveModel(c,m){ try{ localStorage.setItem(keyFor(c), JSON.stringify(m)); }catch(e){} }

let model;
function render(){
  const root = document.documentElement;
  root.setAttribute('data-client', client);
  model = loadModel(client);
  $('#cl').textContent = DATA[client].label;
  $('#clsub').textContent = DATA[client].sub;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.c===client));
  board.innerHTML='';
  const items = DATA[client].items;
  model.cols.forEach(col=>{
    const el = document.createElement('div'); el.className='col'; el.dataset.col=col.id;
    const ids = model.order[col.id]||[];
    el.innerHTML = `<div class="col-h"><span class="ttl" contenteditable="true" spellcheck="false">${esc(col.title)}</span><span class="n">${ids.length}</span><button class="x" title="Delete group">&times;</button></div><div class="cards"></div>`;
    const cards = el.querySelector('.cards');
    ids.forEach(id=>cards.appendChild(cardEl(items[id], id)));
    board.appendChild(el);
    wireCol(el, col);
  });
  const add = document.createElement('button'); add.className='addcol'; add.textContent='+ New group';
  add.onclick=()=>{ const id='c'+Date.now(); model.cols.push({id,title:'New group'}); model.order[id]=[]; persist(); };
  board.appendChild(add);
  stats();
  applyFilter();
}
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function cardEl(it, id){
  const c = document.createElement('div'); c.className='card'; c.draggable=true; c.dataset.id=id;
  const badge = it.count!=null ? (it.size+' · '+it.count+' files') : (it.size||'');
  c.innerHTML = `<div class="r1"><span class="ic ${it.kind}">${KIND_LABEL[it.kind]||''}</span><span class="nm">${esc(it.name)}</span><span class="badge">${esc(badge)}</span></div>${it.desc?`<div class="ds">${esc(it.desc)}</div>`:''}<div class="rel">${esc(it.rel)}</div>`;
  c.addEventListener('click', e=>{ if(!dragging) c.classList.toggle('open'); });
  c.addEventListener('dragstart', e=>{ dragging=c; c.classList.add('drag'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', id); });
  c.addEventListener('dragend', ()=>{ c.classList.remove('drag'); dragging=null; document.querySelectorAll('.col.drop').forEach(x=>x.classList.remove('drop')); });
  return c;
}
let dragging=null;
function wireCol(el, col){
  const cards = el.querySelector('.cards');
  el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('drop');
    const after = afterEl(cards, e.clientY);
    if(dragging){ if(after==null) cards.appendChild(dragging); else cards.insertBefore(dragging, after); } });
  el.addEventListener('dragleave', e=>{ if(!el.contains(e.relatedTarget)) el.classList.remove('drop'); });
  el.addEventListener('drop', e=>{ e.preventDefault(); el.classList.remove('drop'); commit(); });
  const ttl = el.querySelector('.ttl');
  ttl.addEventListener('blur', ()=>{ col.title = ttl.textContent.trim()||'Untitled'; persist(false); });
  ttl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); ttl.blur(); } });
  el.querySelector('.x').addEventListener('click', ()=>{
    const ids = model.order[col.id]||[];
    if(ids.length){ alert('Move its '+ids.length+' cards out first, then delete the group.'); return; }
    model.cols = model.cols.filter(c=>c.id!==col.id); delete model.order[col.id]; persist();
  });
}
function afterEl(container, y){
  const els=[...container.querySelectorAll('.card:not(.drag)')];
  return els.reduce((closest,child)=>{ const box=child.getBoundingClientRect(); const off=y-box.top-box.height/2;
    if(off<0 && off>closest.offset) return {offset:off, el:child}; return closest;
  },{offset:-Infinity,el:null}).el;
}
function commit(){
  const order={}; const place={};
  board.querySelectorAll('.col').forEach(colEl=>{ const cid=colEl.dataset.col; order[cid]=[];
    colEl.querySelectorAll('.card').forEach(cardEl=>{ const id=+cardEl.dataset.id; order[cid].push(id); place[id]=cid; }); });
  model.order=order; model.place=place; saveModel(client,model);
  board.querySelectorAll('.col').forEach(colEl=>{ const n=colEl.querySelector('.n'); if(n) n.textContent=(model.order[colEl.dataset.col]||[]).length; });
  stats();
}
function persist(re=true){ saveModel(client,model); if(re) render(); }
function stats(){
  const items=DATA[client].items;
  $('#s-items').textContent=items.length;
  $('#s-docs').textContent=items.filter(i=>i.kind==='doc'||i.kind==='page').length;
  $('#s-cols').textContent=model.cols.length;
  // total size: sum only folder items (represent bulk) + rough; show disk from known
  $('#s-size').textContent = client==='burns'?'~23 GB':'~630 MB';
}
function applyFilter(){
  const q=$('#search').value.trim().toLowerCase();
  board.querySelectorAll('.card').forEach(c=>{
    const it=DATA[client].items[+c.dataset.id];
    const hay=(it.name+' '+it.desc+' '+it.rel).toLowerCase();
    c.classList.toggle('hide', q && !hay.includes(q));
  });
}
$('#search').addEventListener('input', applyFilter);
$('#reset').addEventListener('click', ()=>{ if(confirm('Reset '+DATA[client].label+' to the default grouping?')){ localStorage.removeItem(keyFor(client)); render(); } });
$('#tabs').addEventListener('click', e=>{ const b=e.target.closest('.tab'); if(b){ client=b.dataset.c; $('#search').value=''; render(); } });
$('#theme').addEventListener('click', ()=>{ const r=document.documentElement; const cur=r.getAttribute('data-theme');
  const dark = cur? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', dark?'light':'dark'); });
render();
